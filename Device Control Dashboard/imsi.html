<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>ESP32 LED 상태 모니터</title>
    <style>
      body {
        font-family: Arial, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
        margin: 20px;
      }
      h2 {
        margin-bottom: 8px;
      }
      p {
        margin: 4px 0 12px;
      }
      table {
        border-collapse: collapse;
        min-width: 480px;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 4px 8px;
        text-align: center;
      }
      th {
        background: #eee;
      }
      tbody tr:nth-child(even) {
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <h2>ESP32 LED 상태 모니터</h2>
    <p>이 페이지는 예시용 정적 HTML입니다. 실제 값은 펌웨어에서 채워집니다.</p>

    <table>
      <thead>
        <tr>
          <th>채널</th>
          <th>입력 상태</th>
          <th>즉시 LED</th>
          <th>타임아웃 LED</th>
          <th>추가 타임아웃 LED</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>0</td>
          <td>HIGH</td>
          <td>LOW</td>
          <td>LOW</td>
          <td>LOW</td>
        </tr>
        <tr>
          <td>1</td>
          <td>LOW</td>
          <td>HIGH</td>
          <td>LOW</td>
          <td>LOW</td>
        </tr>
        <tr>
          <td>2</td>
          <td>LOW</td>
          <td>LOW</td>
          <td>HIGH</td>
          <td>LOW</td>
        </tr>
        <tr>
          <td>3</td>
          <td>LOW</td>
          <td>LOW</td>
          <td>LOW</td>
          <td>HIGH</td>
        </tr>
      </tbody>
    </table>

    <p>
      <small>
        실제 시스템에서는 ESP32 펌웨어에서 각 핀 상태를 읽어
        HTTP 응답으로 이와 비슷한 HTML을 전송하게 됩니다.
      </small>
    </p>
  </body>
</html>

<script>
    const fetchData = async () => {
        const response = await fetch('http://192.168.0.100:8080/api/data');
        const data = await response.json();
        console.log(data);
    }
    fetchData();
</script>
